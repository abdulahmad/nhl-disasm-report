const NDR={cache:{},cb:null,pending:{},loaded(d){this.cache[d.id]=d;const q=this.pending[d.id];if(q){delete this.pending[d.id];q.forEach(c=>c(d))}else if(this.cb){const c=this.cb;this.cb=null;c(d)}}};

function readHash(){const h=new URLSearchParams(location.hash.slice(1));for(const k of['s','v','c','a','b'])if(h.get(k))st[k]=h.get(k);if(h.get('f'))st.f=+h.get('f');st.tip=h.get('tip');st.tint=h.get('tint')==='1';st.nest=h.get('nest')!=='0';st.norm=h.get('norm')==='1'}

 if(st.v==='layout'){
